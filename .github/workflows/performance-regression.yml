name: Performance Regression & SLA Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      vus:
        description: 'Number of Virtual Users (VUs)'
        required: false
        default: '10'
      duration:
        description: 'Test Duration (e.g. 30s, 1m)'
        required: false
        default: '30s'

jobs:
  performance-regression-test:
    name: Run k6 Performance Test & Check SLA Regressions
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: 3. Setup and start EShop SUT
        run: |
          echo "Cloning EShop SUT repository..."
          git clone https://github.com/ttbhanh/eshop-sut.git sut-repo
          cd sut-repo/backend
          npm install
          echo "Starting backend server on port 3000..."
          node server.js &
          echo "Waiting for SUT health readiness..."
          sleep 5
          for i in {1..15}; do
            if curl -s http://localhost:3000/api/products > /dev/null; then
              echo "SUT Backend is UP and healthy!"
              break
            fi
            echo "Waiting for backend ($i/15)..."
            sleep 2
          done

      - name: 4. Seed test user accounts
        run: |
          mkdir -p eshop-sut/backend
          cp sut-repo/backend/database.sqlite eshop-sut/backend/database.sqlite
          node scripts/seed_test_users.js

      - name: 5. Setup k6 testing binary
        uses: grafana/setup-k6-action@v1

      - name: 6. Execute k6 CI Regression Test
        env:
          CI_VUS: ${{ github.event.inputs.vus || '10' }}
          CI_DURATION: ${{ github.event.inputs.duration || '30s' }}
        run: |
          mkdir -p results/ci
          echo "Running k6 CI regression test with $CI_VUS VUs for $CI_DURATION..."
          k6 run --vus $CI_VUS --duration $CI_DURATION \
            --out json=results/ci/raw_metrics.json \
            scripts/23127327_Load_20260902.js || true

      - name: 7. Run Performance Regression Gate & SLA Audit
        run: |
          echo "Analyzing test metrics against SLA benchmarks..."
          node .agents/skills/performance-testing/scripts/extract_metrics.js results/load/metrics.json

      - name: 8. Upload Performance Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-report
          path: |
            results/load/summary.html
            results/load/metrics.json
            results/ci/
          retention-days: 14
