name: Performance Regression & SLA Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      vus:
        description: 'Number of Virtual Users (VUs)'
        required: false
        default: '10'
      duration:
        description: 'Test Duration (e.g. 30s, 1m)'
        required: false
        default: '30s'

jobs:
  performance-regression-test:
    name: Run k6 Performance Test & Check SLA Regressions
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup and start EShop SUT
        run: |
          echo "Cloning EShop SUT repository..."
          git clone https://github.com/ttbhanh/eshop-sut.git eshop-sut
          cd eshop-sut/backend
          npm install
          echo "Starting backend server on port 3000..."
          nohup node server.js > ../../server.log 2>&1 &
          cd ../..
          echo "Waiting for SUT health readiness..."
          sleep 3
          for i in {1..20}; do
            if curl -s http://localhost:3000/api/products | grep -q "id"; then
              echo "SUT Backend is UP and healthy!"
              break
            fi
            echo "Waiting for backend ($i/20)..."
            sleep 2
          done
          cat server.log || true

      - name: 4. Seed test user accounts
        run: |
          node scripts/seed_test_users.js

      - name: 5. Setup k6 testing binary
        uses: grafana/setup-k6-action@v1

      - name: 6. Execute k6 CI Regression Test
        env:
          CI_VUS: ${{ github.event.inputs.vus || '10' }}
          CI_DURATION: ${{ github.event.inputs.duration || '30s' }}
        run: |
          mkdir -p results/load results/ci
          echo "Running k6 CI regression test with $CI_VUS VUs for $CI_DURATION..."
          k6 run --vus $CI_VUS --duration $CI_DURATION \
            --out json=results/ci/raw_metrics.json \
            scripts/23127327_Load_20260902.js

      - name: 7. Run Performance Regression Gate & SLA Audit
        run: |
          echo "Analyzing test metrics against SLA benchmarks..."
          node scripts/extract_metrics.js results/load/metrics.json

      - name: 8. Verify Zero-Omission & Report Integrity
        run: |
          echo "Auditing report integrity to prevent missing bug details or incomplete audit logs..."
          node scripts/verify_report_integrity.js

      - name: 9. Upload Performance Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-report
          path: |
            results/load/summary.html
            results/load/metrics.json
            results/ci/
          retention-days: 14
